<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme's Page Desktop</title>

    <!-- Connecting the tailwindcss output.css file -->
    <link rel="stylesheet" href="../../output.css">

    <!-- Linking all the google fonts used in this entire project -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');
    </style>

</head>
<body>

    <!-- This following div will be treated as the body -->
    <div class="min-h-screen w-screen flex flex-row text-(--on-surface) bg-(--surface) google-fonts-inter">

        <!-- This is the nav bar -->
        <nav class="pt-8 pb-8 bg-(--surface-container-low) border-(--outline-variant) border-r w-70 h-screen top-0 left-0 fixed text-(--on-surface) google-fonts-inter flex flex-col justify-start items-center">

            <!-- App name, Logo & a One liner -->
            <div class="text-(--on-surface) mb-8 pl-6 pr-6 google-fonts-inter w-full">

                

                <div class="w-full flex flex-row justify-start gap-4 items-center">

                    <img src="../../assets/Orbit_assets/OrbitLogo.png" class="h-8 rounded-lg">

                    <h1 class="text-xl font-bold text-(--on-surface) google-fonts-hanken-grotesk">Orbit</h1>


                </div>

                

                <p class="text-sm font-normal text-(--secondary) google-fonts-inter mt-2">Zero Limits</p>

            </div>

            <!-- Start Workout btn -->
            <div class="text-(--on-surface) mb-6 px-6 w-full google-fonts-inter">

                <button class="cursor-pointer w-full rounded-lg bg-(--primary) px-4 py-2 text-xs tracking-wider font-medium text-(--on-primary) google-fonts-jetbrains-mono flex flex-row justify-center items-center gap-2 transition-all duration-200 ease-in-out hover:scale-105 hover:shadow-md hover:bg-(--on-primary-fixed-variant) active:scale-95 active:shadow-none active:bg-(--on-primary-container)"> <img src="../../assets/Themes_Page_assets/add_icon.svg"> Start Workout </button>

            </div>

            <!-- List of all the pages, a user can visit -->
            <ul class="text-(--on-surface) px-2 w-full google-fonts-inter flex flex-col grow overflow-y-auto">

                <li class="google-fonts-inter flex flex-row justify-start cursor-pointer items-center gap-4 rounded-lg border-l-4 border-transparent px-4 py-2 text-(--secondary)"> <img src="../../assets/Themes_Page_assets/dashboard_icon.svg"> Dashboard </li>

            </ul>

        </nav>

    </div>
    
</body>
</html>
