<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>

    <!-- Connecting the tailwindcss output.css file -->
    <link rel="stylesheet" href="../output.css">

    <!-- Linking all the google fonts used in this entire project -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap');
    </style>

</head>
<body>

    <!-- This following div will be treated as the body -->
    <div class="min-h-screen min-w-screen bg-[#fcf9f8] text-(--on-surface) google-fonts-inter flex flex-col justify-start items-center">

        <!-- This is the header -->
        <header class="google-fonts-inter text-(--on-surface) flex flex-row w-full p-8 justify-center items-center">

            <!-- This is the app name -->
            <h1 class="google-fonts-hanken-grotesk text-5xl font-bold text-[#004394]">Orbit</h1>

        </header>

        <!-- this is the main -->
        <main class="google-fonts-inter text-(--on-surface) w-[80%] mx-auto flex flex-col justify-center items-center p-8">

            <h2 class="text-center mb-4 google-fonts-hanken-grotesk text-[40px] font-bold text-(--on-surface)">Track your workouts. Own your data.</h2>

            <p class="text-center google-fonts-inter text-[16px] font-normal text-[#424753]">No subscription. No sign-up. No locked features.</p>

            <!-- This div shows the benefits of using Orbit -->
            <div class="google-fonts-inter text-(--on-surface) grid grid-rows-2 grid-cols-2 gap-4 w-full mt-10">

                <!-- First item: Everything Free -->
                <div class="google-fonts-inter text-(--on-surface) bg-[color-mix(in_srgb,#FEF7FF_70%,transparent)] border border-solid border-[color-mix(in_srgb,#C2C6D6_40%,transparent)] flex flex-cols rounded-2xl p-6 backdrop-blur-md">



                </div>

            </div>

        </main>

    </div>
    
</body>
</html>
