<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Orbit - Setup Name</title>

  <!-- Connecting the tailwindcss output.css file -->
  <link rel="stylesheet" href="../output.css" />

  <!-- JS File -->
  <script defer type="module" src="./2ProfileSetup.js"></script>
  
  <!-- Material Symbols & Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

  <!-- Tailwind CSS Setup -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {

            "inverse-surface": "#313030",
            "on-background": "#1b1b1b",
            "on-secondary-fixed": "#1a1c1c",
            "inverse-on-surface": "#f3f0ef",
            "secondary-container": "#e0dfdf",
            "on-primary-fixed": "#001a42",
            "on-secondary": "#ffffff",
            "primary-container": "#005ac2",
            "on-tertiary-fixed-variant": "#464748",

            "secondary": "#5d5e5e",
            "surface-tint": "#015ac2",
            "surface-container-low": "#f6f3f2",
            "primary": "#004394",
            "primary-fixed": "#d8e2ff",
            "surface-container-highest": "#e5e2e1",
            "surface-container-lowest": "#ffffff",
            "on-primary-container": "#c9d8ff",
            "on-primary-fixed-variant": "#004395",
            "surface-container-high": "#ece6f0",
            "background": "#fcf9f8",
            "on-tertiary-container": "#d8d8d9",
            "surface-dim": "#dcd9d9",
            "outline": "#757780",
            "surface-bright": "#fcf9f8",
            "error": "#b3261e",
            "on-secondary-fixed-variant": "#464747",
            "on-primary": "#ffffff",
            "on-error": "#ffffff",
            "on-surface": "#1b1b1b",
            "on-surface-variant": "#424753",
            "inverse-primary": "#adc6ff",
            "surface": "#fef7ff",
            "secondary-fixed-dim": "#c6c6c6",
            "tertiary-container": "#5d5e5f",
            "tertiary-fixed": "#e3e2e3"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "gutter": "16px",
            "base": "4px",
            "xl": "32px",
            "margin-mobile": "16px",
            "lg": "24px",
            "margin-desktop": "32px",
            "sm": "8px",
            "md": "16px",
            "xs": "4px"
          },
          "fontFamily": {
            "headline-md": ["Hanken Grotesk"],
            "display-lg": ["Hanken Grotesk"],

            "data-lg": ["20px", {"lineHeight": "24px", "fontWeight": "600"}],

    }
  </script>
  
  <style>
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg selection:bg-primary-container selection:text-on-primary-container">

  <!-- Top Logo Anchor -->
  <header class="w-full pt-margin-mobile md:pt-margin-desktop px-margin-mobile md:px-margin-desktop max-w-7xl mx-auto flex justify-start">
    <div class="flex items-center gap-2">
      <!-- REPLACE THE SRC PATH BELOW WITH YOUR EXACT PATH -->
      <img src="../assets/Orbit_assets/OrbitLogo.png" alt="Orbit Logo" class="w-8 h-8 object-cover rounded" />
      <span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Orbit</span>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop w-full max-w-lg mx-auto">
    <div class="w-full flex flex-col gap-xl">
      
      <!-- Header Section -->
      <div class="flex flex-col gap-sm text-center md:text-left">
        <h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background">
          How should we refer to you?
        </h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant">
          Choose the name you'd like Orbit to use.
        </p>
      </div>

      <!-- Input Section -->
      <div class="flex flex-col gap-md">
        <div class="relative w-full">
          <input 
            autofocus 
            id="user-name" 
            type="text"
            maxlength="15"
            placeholder="Your name" 
            class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-md py-lg font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" 
          />
        </div>
        
        <!-- Error Message Container (Hidden by default) -->
        <p id="error-message" class="hidden text-error font-body-md text-sm mt-1"></p>

        <p class="font-body-md text-body-md text-on-surface-variant/80 flex items-center gap-2">
          <span class="material-symbols-outlined text-[16px] text-outline">info</span>
          No account needed. This is just your name in Orbit.
        </p>
      </div>

      <!-- Action Section -->
      <div class="pt-sm w-full">
        <button id="continue-btn" class="w-full bg-primary text-on-primary font-body-lg text-body-lg font-semibold py-lg px-xl rounded-lg hover:bg-primary/90 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 group shadow-sm hover:shadow-md">
          Continue
          <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
        </button>
      </div>
      
    </div>
  </main>

  <!-- Connects to the JavaScript logic file -->
  <script src="script.js"></script>
</body>
</html>
